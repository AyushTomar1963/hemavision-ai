# Railway service config — https://docs.railway.com/reference/config-as-code
#
# Point the Railway service's Root Directory at `backend/` in the
# dashboard and this file is picked up automatically.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port ${PORT}"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
